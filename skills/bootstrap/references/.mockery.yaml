all: true
recursive: true
dir: '{{.InterfaceDir}}'
filename: '{{.InterfaceName}}_mock.go'
structname: '{{.InterfaceName}}Mock'
pkgname: '{{.SrcPackageName}}'
template: testify
template-data:
  unroll-variadic: true
packages:
  # На каркасе интерфейсов ещё нет; рекурсивный обход internal не падает.
  # Когда моки нужны не везде — заменить на конкретные import path.
  <module>/internal:
